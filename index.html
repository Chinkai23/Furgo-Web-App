<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffbf8" />
    <meta name="description" content="Better care for every pet. Discover trusted pet services with Furgo." />
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
        navigator.serviceWorker.register('./service-worker.js', { scope: './', updateViaCache: 'none' }).catch((error) => {
          console.warn('Furgo update support could not start:', error);
        });
      }
    </script>
    <!-- Browser tab icon uses the Furgo brand logo. -->
    <link rel="icon" type="image/png" href="Image/Icon/Logo.png" />
    <title>Furgo — Better Care For Every Pet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    <!-- js/app.js routes between the screen modules in js/pages/. -->
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <!-- JavaScript inserts the active page into this container. -->
    <div id="app"></div>
  </body>
</html>
